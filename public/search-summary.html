<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>検索 | ワークマンアプリ</title><style>:root{--yellow:#f2aa20;--line:#e7d7b5;--text:#172433;--muted:#617082}*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:var(--text);font-family:"Yu Gothic UI","Meiryo",sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:18px clamp(20px,5vw,72px);background:var(--yellow)}h1{margin:0;font-size:1.4rem}main{width:min(1000px,calc(100% - 32px));margin:0 auto;padding:28px 0}.card{padding:20px;background:#fff;border:1px solid var(--line);border-radius:12px}form{display:flex;gap:8px}input{flex:1;padding:11px;border:1px solid #bfcbd6;border-radius:7px;font:inherit}button{min-height:44px;padding:8px 16px;border:1px solid #d9910c;border-radius:8px;background:var(--yellow);font:inherit;font-weight:700;cursor:pointer}.result{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid #e4e8ec}.thumbnail{display:grid;width:150px;height:150px;place-items:center;border-radius:8px;background:#edf0f2;color:var(--muted);font-size:.8rem;overflow:hidden}.thumbnail img{width:100%;height:100%;object-fit:cover}.customer{margin:0 0 10px;font-size:1.18rem}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px}.detail{margin:0;color:#394a5a;font-size:.9rem;line-height:1.45}.detail b{display:block;color:var(--muted);font-size:.78rem}.wide{grid-column:1/-1}.muted{color:var(--muted)}@media(max-width:600px){main{width:min(100% - 24px,1000px)}.result{grid-template-columns:90px 1fr;gap:12px}.thumbnail{width:90px;height:90px}.details{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header><h1>履歴検索</h1><a href="/">タイトルへ戻る</a></header><main><section class="card"><form id="search-form"><input id="query" placeholder="お客様名・フリガナ・電話番号・管理IDで検索"><button>検索</button></form><div id="results" class="muted" style="margin-top:18px">検索条件を入力してください。</div></section></main><script>
const form=document.querySelector('#search-form'),results=document.querySelector('#results');
const field=(label,value,wide=false)=>{const p=document.createElement('p');p.className='detail'+(wide?' wide':'');const b=document.createElement('b');b.textContent=label;p.append(b,document.createTextNode(value||'未入力'));return p};
const card=row=>{const item=document.createElement('article');item.className='result';const thumb=document.createElement('div');thumb.className='thumbnail';if(row.thumbnail_path){const img=document.createElement('img');img.src='/'+row.thumbnail_path.replaceAll('\\','/');img.alt='伝票写真';thumb.append(img)}else thumb.textContent='写真なし';const detail=document.createElement('div'),name=document.createElement('h2'),grid=document.createElement('div');name.className='customer';name.textContent=row.customer_name;grid.className='details';let work='';try{work=JSON.parse(row.work_types_json).join('・')}catch{}grid.append(field('受付日',row.received_date),field('電話番号',row.phone),field('受付担当者',row.staff),field('作業内容',work),field('商品詳細',row.product_details,true),field('注文金額',row.amount?`${row.amount}円`:''),field('内金の有無',row.deposit),field('確認状態',row.confirmation_status),field('アプリへの登録日',row.registered_date));detail.append(name,grid);item.append(thumb,detail);return item};
form.addEventListener('submit',async event=>{event.preventDefault();results.textContent='検索中です…';const response=await fetch('/api/requests?q='+encodeURIComponent(document.querySelector('#query').value));const data=await response.json();results.replaceChildren(...(data.rows.length?data.rows.map(card):[document.createTextNode('該当するデータはありません。')]))});
</script></body></html>
