<!doctype html>
<html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>検索 | ワークマンアプリ</title><style>:root{--yellow:#f2aa20;--line:#e7d7b5;--text:#172433}*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:var(--text);font-family:"Yu Gothic UI","Meiryo",sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:18px clamp(20px,5vw,72px);background:var(--yellow)}h1{margin:0;font-size:1.4rem}main{width:min(900px,calc(100% - 32px));margin:0 auto;padding:28px 0}.card{padding:20px;background:#fff;border:1px solid var(--line);border-radius:12px}form{display:flex;gap:8px}input{flex:1;padding:11px;border:1px solid #bfcbd6;border-radius:7px;font:inherit}button{min-height:44px;padding:8px 16px;border:1px solid #d9910c;border-radius:8px;background:var(--yellow);font:inherit;font-weight:700;cursor:pointer}.row{display:grid;grid-template-columns:110px 1fr 120px 110px;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid #e4e8ec}.muted{color:#617082}@media(max-width:600px){.row{grid-template-columns:1fr 1fr}.row span:first-child{grid-column:1/-1}}</style></head><body><header><h1>履歴検索</h1><a href="/">タイトルへ戻る</a></header><main><section class="card"><form id="search-form"><input id="query" placeholder="お客様名・フリガナ・電話番号・管理IDで検索" /><button>検索</button></form><div id="results" class="muted" style="margin-top:18px">検索条件を入力してください。</div></section></main><script>const results=document.querySelector('#results');document.querySelector('#search-form').addEventListener('submit',async(e)=>{e.preventDefault();const response=await fetch(`/api/requests?q=${encodeURIComponent(document.querySelector('#query').value)}`);const {rows}=await response.json();results.replaceChildren(rows.length? ...rows.map(row=>{const item=document.createElement('div');item.className='row';item.innerHTML=`<span>${row.app_number}</span><strong></strong><span></span><span></span>`;item.querySelector('strong').textContent=row.customer_name;item.querySelectorAll('span')[1].textContent=row.phone??'';item.querySelectorAll('span')[2].textContent=row.confirmation_status;return item;}):document.createTextNode('該当するデータはありません。'));});</script></body></html>
