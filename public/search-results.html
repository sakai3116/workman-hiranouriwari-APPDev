<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>検索 | ワークマンアプリ</title><style>:root{--yellow:#f2aa20;--line:#e7d7b5;--text:#172433}*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:var(--text);font-family:"Yu Gothic UI","Meiryo",sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:18px clamp(20px,5vw,72px);background:var(--yellow)}h1{margin:0;font-size:1.4rem}main{width:min(900px,calc(100% - 32px));margin:0 auto;padding:28px 0}.card{padding:20px;background:#fff;border:1px solid var(--line);border-radius:12px}form{display:flex;gap:8px}input{flex:1;padding:11px;border:1px solid #bfcbd6;border-radius:7px;font:inherit}button{min-height:44px;padding:8px 16px;border:1px solid #d9910c;border-radius:8px;background:var(--yellow);font:inherit;font-weight:700;cursor:pointer}.row{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #e4e8ec}.thumbnail{display:grid;width:96px;height:96px;place-items:center;border-radius:7px;background:#edf0f2;color:#617082;font-size:.78rem;overflow:hidden}.thumbnail img{width:100%;height:100%;object-fit:cover}.name{margin:0;font-size:1.08rem}.info{margin:6px 0 0;color:#526171;font-size:.9rem}.muted{color:#617082}@media(max-width:600px){main{width:min(100% - 24px,900px)}.row{grid-template-columns:78px 1fr}.thumbnail{width:78px;height:78px}}</style></head><body><header><h1>履歴検索</h1><a href="/">タイトルへ戻る</a></header><main><section class="card"><form id="search-form"><input id="query" placeholder="お客様名・フリガナ・電話番号・管理IDで検索"><button>検索</button></form><div id="results" class="muted" style="margin-top:18px">検索条件を入力してください。</div></section></main><script>
const form=document.querySelector('#search-form'),results=document.querySelector('#results');
const card=row=>{const item=document.createElement('article');item.className='row';const thumb=document.createElement('div');thumb.className='thumbnail';if(row.thumbnail_path){const img=document.createElement('img');img.src='/'+row.thumbnail_path.replaceAll('\\','/');img.alt='伝票写真';thumb.append(img)}else thumb.textContent='写真なし';const detail=document.createElement('div'),name=document.createElement('h2'),phone=document.createElement('p'),work=document.createElement('p');name.className='name';phone.className=work.className='info';name.textContent=row.customer_name;phone.textContent='電話番号：'+(row.phone||'未入力');try{work.textContent='作業内容：'+(JSON.parse(row.work_types_json).join('・')||'未入力')}catch{work.textContent='作業内容：未入力'}detail.append(name,phone,work);item.append(thumb,detail);return item};
form.addEventListener('submit',async event=>{event.preventDefault();results.textContent='検索中です…';const response=await fetch('/api/requests?q='+encodeURIComponent(document.querySelector('#query').value));const data=await response.json();results.replaceChildren(...(data.rows.length?data.rows.map(card):[document.createTextNode('該当するデータはありません。')]))});
</script></body></html>
