<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>受付情報を編集</title><style>body{margin:0;background:#f4f7fa;color:#172433;font-family:"Yu Gothic UI","Meiryo",sans-serif}header{padding:18px 5%;background:#f2aa20}main{max-width:800px;margin:auto;padding:28px 16px}.card{padding:20px;background:#fff;border:1px solid #e7d7b5;border-radius:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:bold;font-size:.9rem}input,textarea,select{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid #bfcbd6;border-radius:7px;font:inherit}textarea{min-height:80px}.full{grid-column:1/-1}button{margin-top:20px;padding:11px 18px;border:1px solid #d9910c;border-radius:8px;background:#f2aa20;font:inherit;font-weight:bold}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><b>受付情報を編集</b></header><main><form class="card" id="form"><div class="grid"><label>お客様名<input name="customerName" required></label><label>電話番号<input name="phone"></label><label>受付日<input name="receivedDate" type="date"></label><label>受付担当者<input name="staff"></label><label>フリガナ<input name="customerKana"></label><label>作業内容（・区切り）<input name="workTypes"></label><label>注文金額<input name="amount"></label><label>内金<select name="deposit"><option></option><option>あり</option><option>なし</option></select></label><label>売掛金<select name="accountsReceivable"><option></option><option>あり</option><option>なし</option></select></label><label>確認状態<select name="confirmationStatus"><option>登録済み</option><option>要確認</option></select></label><label class="full">備考<textarea name="notes"></textarea></label></div><button>更新を保存</button><p id="status"></p></form></main><script>const id=new URLSearchParams(location.search).get('id'),form=document.querySelector('#form'),set=(n,v)=>form.elements[n].value=v||'';let products=[];fetch('/api/requests/'+id).then(r=>r.json()).then(d=>{const r=d.request;['customerName','phone','receivedDate','staff','customerKana','amount','deposit','accountsReceivable','confirmationStatus','notes'].forEach(n=>set(n,n==='customerName'?r.customer_name:r[n.replace(/[A-Z]/g,m=>'_'+m.toLowerCase())]));set('workTypes',JSON.parse(r.work_types_json).join('・'));products=d.products});form.onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(form));x.workTypes=x.workTypes.split('・').filter(Boolean);x.products=products;const r=await fetch('/api/requests/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});document.querySelector('#status').textContent=r.ok?'更新しました。検索画面へ戻ります。':'更新に失敗しました。';if(r.ok)setTimeout(()=>location.href='/search',500)};</script></body></html>
