<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>履歴検索 | ワークマンアプリ</title>
  <style>
    :root{--yellow:#f2aa20;--line:#e7d7b5;--text:#172433;--muted:#617082}*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:var(--text);font-family:"Yu Gothic UI","Meiryo",sans-serif}header{display:flex;justify-content:space-between;padding:18px 5%;background:var(--yellow)}main{max-width:1000px;margin:auto;padding:28px 16px}.card{padding:20px;background:#fff;border:1px solid var(--line);border-radius:12px}form{display:flex;gap:8px}input{flex:1;padding:11px;border:1px solid #bfcbd6;border-radius:7px;font:inherit}button,.edit{padding:10px 16px;border:1px solid #d9910c;border-radius:8px;background:var(--yellow);color:var(--text);font:inherit;font-weight:bold;cursor:pointer;text-decoration:none}.row{display:grid;grid-template-columns:180px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid #e4e8ec}.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;align-content:start}.thumb{width:87px;height:87px;background:#edf0f2;display:grid;place-items:center;overflow:hidden;border-radius:5px}.thumb img{width:100%;height:100%;object-fit:cover}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid p{margin:0;font-size:.9rem}.grid b{display:block;color:var(--muted);font-size:.78rem}.actions{margin-top:14px}.photo-count{grid-column:1/-1;margin:2px 0 0;color:var(--muted);font-size:.78rem}@media(max-width:600px){.row{grid-template-columns:102px 1fr}.thumbs{grid-template-columns:1fr}.thumb{width:96px;height:96px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><b>履歴検索</b><a href="/">タイトルへ戻る</a></header>
  <main><section class="card"><form id="form"><input id="q" placeholder="お客様名・フリガナ・電話番号・管理IDで検索"><button>検索</button></form><div id="results"></div></section></main>
  <script>
    const form=document.querySelector('#form'),out=document.querySelector('#results');
    const field=(name,value)=>{const p=document.createElement('p'),b=document.createElement('b');b.textContent=name;p.append(b,document.createTextNode(value||'未入力'));return p};
    const photoPaths=(row)=>String(row.photo_paths||'').split('|').filter(Boolean);
    const card=(row)=>{
      const article=document.createElement('article');article.className='row';
      const thumbs=document.createElement('div');thumbs.className='thumbs';
      const paths=photoPaths(row);
      if(paths.length){paths.forEach((path,index)=>{const box=document.createElement('div');box.className='thumb';const image=new Image();image.src='/'+path.replaceAll('\\','/');image.alt=`登録写真 ${index+1}`;box.append(image);thumbs.append(box)});const count=document.createElement('p');count.className='photo-count';count.textContent=`登録写真 ${paths.length}枚`;thumbs.append(count)}else thumbs.textContent='写真なし';
      let work='';try{work=JSON.parse(row.work_types_json).join('・')}catch{}
      const detail=document.createElement('div'),title=document.createElement('h2'),grid=document.createElement('div'),actions=document.createElement('div'),edit=document.createElement('a');
      title.textContent=row.customer_name;grid.className='grid';grid.append(field('受付日',row.received_date),field('電話番号',row.phone),field('受付担当者',row.staff),field('作業内容',work),field('商品詳細',row.product_details),field('注文金額',row.amount),field('内金の有無',row.deposit),field('確認状態',row.confirmation_status),field('アプリへの登録日',row.registered_date));
      actions.className='actions';edit.className='edit';edit.href='/edit?id='+row.id;edit.textContent='編集';actions.append(edit);detail.append(title,grid,actions);article.append(thumbs,detail);return article;
    };
    form.addEventListener('submit',async(event)=>{event.preventDefault();out.textContent='検索中です…';try{const response=await fetch('/api/requests?q='+encodeURIComponent(q.value));const data=await response.json();out.replaceChildren(...(data.rows.length?data.rows.map(card):[document.createTextNode('該当するデータはありません。')]))}catch{out.textContent='検索に失敗しました。'}});
  </script>
</body>
</html>
