<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>履歴検索</title><style>body{margin:0;background:#f4f7fa;color:#172433;font-family:"Yu Gothic UI","Meiryo",sans-serif}header{display:flex;justify-content:space-between;padding:18px 5%;background:#f2aa20}main{max-width:1000px;margin:auto;padding:28px 16px}.card{padding:20px;background:#fff;border:1px solid #e7d7b5;border-radius:12px}form{display:flex;gap:8px}input{flex:1;padding:11px;border:1px solid #bfcbd6;border-radius:7px;font:inherit}button,.edit{padding:10px 16px;border:1px solid #d9910c;border-radius:8px;background:#f2aa20;color:#172433;font:inherit;font-weight:bold;cursor:pointer;text-decoration:none}.row{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid #e4e8ec}.thumb{width:130px;height:130px;background:#edf0f2;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid p{margin:0;font-size:.9rem}.grid b{display:block;color:#617082;font-size:.78rem}.actions{margin-top:14px}@media(max-width:600px){.row{grid-template-columns:90px 1fr}.thumb{width:90px;height:90px}.grid{grid-template-columns:1fr}}</style></head><body><header><b>履歴検索</b><a href="/">タイトルへ戻る</a></header><main><section class="card"><form id="form"><input id="q" placeholder="お客様名・フリガナ・電話番号・管理IDで検索"><button>検索</button></form><div id="results"></div></section></main><script>const f=document.querySelector('#form'),out=document.querySelector('#results'),field=(n,v)=>{const p=document.createElement('p');p.innerHTML='<b></b>';p.querySelector('b').textContent=n;p.append(v||'未入力');return p};f.onsubmit=async e=>{e.preventDefault();const d=await (await fetch('/api/requests?q='+encodeURIComponent(q.value))).json();out.replaceChildren(...(d.rows.length?d.rows.map(r=>{const a=document.createElement('article');a.className='row';const t=document.createElement('div');t.className='thumb';if(r.thumbnail_path){const i=new Image();i.src='/'+r.thumbnail_path.replaceAll('\\','/');t.append(i)}else t.textContent='写真なし';let w='';try{w=JSON.parse(r.work_types_json).join('・')}catch{}const x=document.createElement('div'),h=document.createElement('h2'),g=document.createElement('div'),act=document.createElement('div');h.textContent=r.customer_name;g.className='grid';g.append(field('受付日',r.received_date),field('電話番号',r.phone),field('受付担当者',r.staff),field('作業内容',w),field('商品詳細',r.product_details),field('注文金額',r.amount),field('内金の有無',r.deposit),field('確認状態',r.confirmation_status),field('アプリへの登録日',r.registered_date));act.className='actions';const edit=document.createElement('a');edit.className='edit';edit.href='/edit?id='+r.id;edit.textContent='編集';act.append(edit);x.append(h,g,act);a.append(t,x);return a}):[document.createTextNode('該当するデータはありません。')]));};</script></body></html>
